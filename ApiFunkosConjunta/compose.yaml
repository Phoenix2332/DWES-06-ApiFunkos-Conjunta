services:
  apifunkosconjunta:
    image: apifunkosconjunta
    build:
      context: .
      dockerfile: ApiFunkosConjunta/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - mongodb
      - redis

  postgres:
    image: postgres:18
    container_name: apifunkos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ApiFunkos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  mongodb:
    image: mongo:8
    container_name: apifunkos-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8
    container_name: apifunkos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongodb_data:
  redis_data: