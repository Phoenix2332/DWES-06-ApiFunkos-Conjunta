name: apifunkos-development

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ApiFunkos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Servidor SMTP local para probar el envio de correos sin salir a internet.
  # Buzon web en http://localhost:1080   (TiendaDawApi y UD02, apartado 21)
  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - "1080:1080"   # Interfaz web
      - "1025:1025"   # SMTP

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
